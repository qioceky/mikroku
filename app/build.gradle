plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.jetbrains.kotlin.android)
    alias(libs.plugins.jetbrains.kotlin.compose)
}

android {
    namespace 'id.mikroku'
    compileSdk 35

    defaultConfig {
        applicationId "id.mikroku"
        minSdk 26
        targetSdk 35
        versionCode 25
        versionName "1.2.1"
    }

    buildFeatures {
        compose = true
        buildConfig = true
    }

    signingConfigs {
        // MikroKu: keystore tetap (JKS) dari secret CI sejak rilis pertama.
        // Tanpa env MIKROKU_STORE_FILE, build memakai debug bawaan
        // (workflow CI gagal eksplisit bila secret keystore kosong).
        pinned {
            storeFile file(System.getenv("MIKROKU_STORE_FILE") ?: "/nonexistent/mikroku-pinned.keystore")
            storePassword System.getenv("MIKROKU_STORE_PASSWORD") ?: "android"
            keyAlias System.getenv("MIKROKU_KEY_ALIAS") ?: "mikroku"
            keyPassword System.getenv("MIKROKU_KEY_PASSWORD") ?: "android"
            storeType "jks"
        }
    }

    buildTypes {
        release {
            if (System.getenv("MIKROKU_STORE_FILE")) {
                signingConfig signingConfigs.pinned
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug {
            if (System.getenv("MIKROKU_STORE_FILE")) {
                signingConfig signingConfigs.pinned
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation libs.core.ktx
    implementation libs.activity.compose
    implementation libs.lifecycle.viewmodel.compose
    implementation libs.lifecycle.runtime.compose
    implementation platform(libs.compose.bom)
    implementation libs.compose.ui
    implementation libs.compose.ui.graphics
    implementation libs.compose.ui.tooling.preview
    implementation libs.compose.material3
    debugImplementation libs.compose.ui.tooling
    // Transfer file router (unduh/unggah) lewat SFTP — API biner tidak bisa
    // memindahkan isi file, jadi memakai service SSH router (port 22).
    implementation 'com.hierynomus:sshj:0.41.2'
    // sshj menandai BouncyCastle sebagai dependensi opsional — nyatakan eksplisit.
    implementation 'org.bouncycastle:bcprov-jdk18on:1.78.1'
    // Backup otomatis terjadwal (pekerja latar) + tulis folder pilihan user (SAF).
    implementation 'androidx.work:work-runtime-ktx:2.9.0'
    implementation 'androidx.documentfile:documentfile:1.0.1'
}
